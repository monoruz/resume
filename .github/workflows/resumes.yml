name: Build resumes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Validate career database
        run: python3 build/check.py

      - name: Show Chrome version
        run: google-chrome --version

      - name: Render resumes
        id: render
        env:
          STRICT_PAGES: '1'   # a resume that is not exactly 2 pages fails the build
        run: |
          shopt -s nullglob
          sources=(jobs/*/resume.html)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "No jobs/*/resume.html yet — nothing to render."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in "${sources[@]}"; do
            echo "::group::$f"
            build/render.sh "$f"
            echo "::endgroup::"
          done
          echo "count=${#sources[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload PDFs as build artifacts
        if: steps.render.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: jobs/*/resume.pdf
          if-no-files-found: error

      - name: Publish rolling release
        if: steps.render.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest resumes
          body: |
            Built from ${{ github.sha }} on ${{ github.event.head_commit.timestamp }}.
            ${{ steps.render.outputs.count }} resume(s), each verified at exactly 2 pages.
          files: jobs/*/resume.pdf
          make_latest: true
