    tech: [Bun, TypeScript, MongoDB, Pinecone, OpenSearch, Telegram Bot API,
           GitHub REST API, Cloud coding agents (Cursor), Sentry, New Relic, Cloudflare,
           GitHub Actions, systemd]
    bullets:

      # ---- group: adaptive learning engine ----
      - text: >-
          Built a Telegram-native adaptive quiz platform end to end — course picker,
          question card, code snippet, lettered option buttons, graded explanation — on a
          MongoDB model of eight collections (Course, Question, QuizAnswer, QuizSession,
          EduChat, RepoSync, QuizRevision, AsyncTask), with per-chat active-course state
          driving every flow.
        group: learning-engine
        tags: [typescript, bun, mongodb, telegram, product-engineering, bot, domain-modelling, api-design]
        impact: high
      - text: >-
          Designed the difficulty-adaptive question picker: a per-chat score floor that
          Harder raises by 10% (falling back to a tenth of the course's score span when
          the multiplier fails to move it) and Easier lowers, selecting through four
          ordered candidate pools — unshown at the floor, any unshown, shown at the floor,
          then any remaining — so repeats only appear once the course is exhausted, and
          marking the pick as relaxed when nothing sits at or above the floor.
        group: learning-engine
        tags: [algorithms, adaptive-learning, ranking, product-engineering, typescript, domain-modelling]
        impact: high
      - text: >-
          Pushed catalogue selection into the database rather than application memory:
