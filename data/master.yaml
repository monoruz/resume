  - id: datasource-panels
    name: Datasource Management Panels (MongoDB · PostgreSQL · OpenSearch · MinIO)
    year: Aug – Sep 2026
    # Documented from the code on 2026-09-18: 86 commits across four repos between
    # 19 Aug and 15 Sep 2026, ~7.8K lines of hand-written TypeScript excluding generated
    # UI primitives, 162 assertions across 8 test files. Every figure here is countable
    # from the repos; none is estimated. Usage numbers are absent on purpose — see
    # q-datasource-panels-usage.
    summary: >-
      Four self-hosted admin consoles built on one architecture — a browser-side console
      for MongoDB, PostgreSQL, OpenSearch and MinIO, each connecting to a datastore the
      user supplies at runtime rather than one baked into the deployment, with no
      credential ever written to a server-side store.
    link: github.com/monoruz
    live: https://monogo.vercel.app · https://postgres-panel.vercel.app · https://opensearch-panel.vercel.app · https://minio-admin.vercel.app
    tech: [TypeScript, Next.js 16 (App Router), React 19, Node.js, MongoDB, PostgreSQL,
           OpenSearch, MinIO, node-postgres, AWS SigV4, Tailwind CSS, Vercel]
    bullets:

      # ---- group: shared platform ----
      - text: >-
          Built four database admin consoles on one shared architecture — MongoDB,
          PostgreSQL, OpenSearch and MinIO — where the operator pastes a connection string
          at runtime and the panel introspects whatever it finds, so a single deployment
          serves any cluster rather than being bound to one configured at build time.
        group: platform
        tags: [typescript, nextjs, react, architecture, developer-tools, databases, product-engineering]
        impact: high
      - text: >-
          Kept credentials out of server-side storage entirely: every connection lives in
          an httpOnly, SameSite=Lax cookie scoped to the browser session — secure-flagged
          from the forwarded protocol, 90-day lifetime — so the hosted panels hold no
          database secret of their own and a deployment compromise exposes no stored
          connection.
        group: platform
        tags: [security, authentication, cookies, session-management, threat-modelling, backend]
        impact: high
      - text: >-
          Let the MongoDB panel hold up to eight saved connections per session, encoded
          into one cookie against a 3,500-byte budget checked before the write, with
          usernames and passwords redacted out of every URI before it reaches the UI and a
          duplicate check that re-activates an existing entry instead of storing it twice.
        group: platform
        tags: [session-management, security, redaction, multi-tenancy, ux, typescript]
        impact: med

      # ---- group: MongoDB panel ----
      - text: >-
          Inferred collection schemas from data rather than a declared model: a 50-document
          sample walked three levels deep across up to 80 paths, classifying BSON types
          (ObjectId, Decimal128, Binary, Timestamp) alongside JSON ones and recording
          per-field coverage, so a schemaless collection renders as a typed table with the
          most-populated fields first.
        group: mongodb
        tags: [mongodb, schema-inference, bson, data-modelling, algorithms, typescript]
        impact: high
      - text: >-
          Derived foreign keys where MongoDB has none: field-name suffixes (Id, Ids, Slug,
          Name, Ref) resolved against the live collection list through singular, plural and
          PascalCase variants, then dereferenced on hover into a preview of the referenced
          document — giving a document store the relational navigation it does not natively
          offer.
        group: mongodb
        tags: [mongodb, relations, inference, algorithms, developer-tools, ux, typescript]
        impact: high
      - text: >-
          Compiled the query UI to native Mongo rather than filtering in the browser: ten
          filter operators typed to each field's inferred type, $text search when the
          collection carries a text index and an escaped-regex fan-out across inferred
          string fields when it does not, direct ObjectId lookup when the term is a
          24-character hex id, and server-side pagination throughout.
        group: mongodb
        tags: [mongodb, query-optimization, search, indexing, pagination, backend, typescript]
        impact: high
      - text: >-
          Hardened the document editor against prototype pollution and malformed input —
          __proto__, constructor and prototype rejected at every path segment, dotted paths
          validated before assignment, and extended-JSON $oid and $date hydrated back into
          real BSON types on the way in.
        group: mongodb
        tags: [security, input-validation, prototype-pollution, mongodb, bson, backend]
        impact: high
      - text: >-
          Cached one connected client per URI on the global object so serverless
          invocations reuse pools instead of reconnecting, with 8-second selection and
          connect timeouts, automatic directConnection for local hosts, and driver errors
          translated into remedies — refused localhost connections, failed auth, and
          unreachable clusters each explained in terms of what to change.
        group: mongodb
        tags: [performance, connection-pooling, serverless, error-handling, developer-experience, mongodb]
        impact: med

      # ---- group: PostgreSQL panel ----
      - text: >-
          Built a schema designer over the PostgreSQL catalogs — pg_database, pg_namespace,
          pg_class, pg_constraint and information_schema — that reads tables, columns,
          estimated row counts and full constraint definitions via pg_get_constraintdef,
          with constraint columns resolved in declaration order through conkey ordinality.
        group: postgres
        tags: [postgresql, sql, introspection, system-catalogs, data-modelling, backend]
        impact: high
      - text: >-
          Covered the DDL surface an operator actually needs: create table with primary
          key, unique, foreign key and check constraints; add, alter, rename and drop
          column; add and drop constraint; create, switch and drop database — each
          assembled from validated fragments rather than string-interpolated user input.
        group: postgres
        tags: [postgresql, ddl, sql, database-administration, api-design, backend]
        impact: high
      - text: >-
          Closed the SQL-injection surface that a schema editor inherently opens: every
          identifier matched against a strict pattern and double-quote-escaped before
          quoting, every type checked against a whitelist of twelve regex patterns, default
          values normalised through bare-keyword, numeric and quoted-literal forms with
          statement terminators and comment markers rejected, check expressions refused if
          they carry any DDL or DML keyword, and all row-level CRUD parameterised.
        group: postgres
        tags: [security, sql-injection, input-validation, postgresql, defensive-programming, backend]
        impact: high
      - text: >-
          Made dropping a database work on managed hosts, where it usually does not: the
          panel reconnects to a maintenance database it can actually open, terminates
          competing backends through pg_stat_activity, tries DROP DATABASE WITH (FORCE) and
          falls back to the plain form — with provider-internal databases (Aiven's _aiven,
          rdsadmin, cloudsqladmin, azure_maintenance) excluded from connection attempts
          after pg_hba rejections were traced to them.
        group: postgres
        tags: [postgresql, managed-services, reliability, debugging, operations, aiven, backend]
        impact: high

      # ---- group: OpenSearch and MinIO ----
      - text: >-
          Built an OpenSearch console that flattens nested mappings into dotted field paths
          and compiles the filter UI into the right query for each field type —
          simple_query_string across text and keyword fields, term against the .keyword
          subfield, case-insensitive wildcard, match_phrase, and range — with index listing
          via _cat, system indices hidden, and bulk deletes routed through _delete_by_query
          with conflicts=proceed.
        group: search-storage
        tags: [opensearch, elasticsearch, search, query-dsl, mappings, backend, typescript]
        impact: high
      - text: >-
          Stripped credentials from OpenSearch request URLs before dispatch, moving them
          into a Basic authorization header, so cluster passwords never appear in a request
          line that a proxy or access log would record.
        group: search-storage
        tags: [security, credentials, logging, opensearch, networking, backend]
        impact: med
      - text: >-
          Signed MinIO admin API calls by hand with AWS Signature V4 to reach the
          list-users, user-info, create-user and set-user-policy endpoints the official SDK
          does not expose — pairing them with SDK calls for buckets, objects and policies
          so one console covers both storage and identity.
        group: search-storage
        tags: [minio, s3, aws-sigv4, object-storage, iam, api-integration, backend]
        impact: high

      # ---- group: engineering practice ----
      - text: >-
          Tested the logic that carries the risk — identifier quoting, type and default-value
          validation, schema inference, foreign-key resolution, query compilation, URI
          masking and the drop-database fallback — with 162 assertions across eight files,
          written as plain Node scripts run through --experimental-strip-types so the suites
          add no test-framework dependency at all.
        group: practice
        tags: [testing, quality, security-testing, nodejs, typescript, zero-dependency, maintainability]
        impact: high
      - text: >-
          Shipped all four panels to production on Vercel in under a month — 86 commits
          between 19 August and 15 September 2026 across four repositories, roughly 7.8K
          lines of hand-written TypeScript excluding generated UI primitives — on Next.js 16
          App Router with React 19 and Node-runtime route handlers.
        group: practice
        tags: [delivery, velocity, nextjs, react, vercel, deployment, typescript]
        impact: med
      - text: >-
          Converged the four panels on one set of conventions — cookie-held connections,
          a single JSON route handler per datastore, typed error translation at the edge,
          and the same connect-introspect-browse-edit flow — so each new datastore reused
          the previous panel's shape rather than restarting the design.
        group: practice
        tags: [architecture, consistency, reuse, design-patterns, developer-experience, typescript]
        impact: med

